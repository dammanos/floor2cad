<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Floor2CAD Converter - Matterport Floorplans</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      margin: 0;
      padding: 0;
    }
    header {
      background: #1a1a1a;
      color: white;
      text-align: center;
      padding: 1rem;
    }
    .logo {
      max-height: 40px;
      vertical-align: middle;
    }
    h1 {
      margin: 0.5rem 0;
    }
    .subtitle {
      font-size: 0.9rem;
      color: #aaa;
      margin-top: 0.3rem;
    }
    .container {
      max-width: 600px;
      margin: 2rem auto;
      background: white;
      padding: 2rem;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(0,0,0,0.05);
      text-align: center;
    }
    .drop-zone {
      border: 2px dashed #aaa;
      padding: 2rem;
      border-radius: 8px;
      background: #fafafa;
      cursor: pointer;
      transition: border-color 0.3s;
    }
    .drop-zone.dragover {
      border-color: #28a745;
      background: #f0fff5;
    }
    .drop-zone input {
      display: none;
    }
    .filename {
      margin-top: 1rem;
      font-weight: bold;
      color: #333;
    }
    .preview {
      margin-top: 1rem;
      max-height: 200px;
      display: none;
    }
    .options {
      margin-top: 1.5rem;
      text-align: left;
      padding: 1rem;
      background: #f9f9f9;
      border-radius: 5px;
    }
    .option-row {
      margin: 0.8rem 0;
    }
    .option-row label {
      display: inline-block;
      margin-left: 0.5rem;
      cursor: pointer;
    }
    .option-row input[type="number"] {
      width: 60px;
      padding: 0.3rem;
      margin-left: 0.5rem;
    }
    .submit-btn {
      margin-top: 1.5rem;
      background: #28a745;
      color: white;
      padding: 0.6rem 1.5rem;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 1rem;
    }
    .submit-btn:hover {
      background: #218838;
    }
    .error {
      color: red;
      margin-top: 1rem;
    }
    .loader {
      margin-top: 1.5rem;
      display: none;
    }
  </style>
</head>
<body>

<header>
  <img src="/static/logo.png" alt="Floor2CAD Logo" class="logo">
  <h1>Floor2CAD Converter</h1>
  <p class="subtitle">Convert Matterport Floorplan Exports to DXF</p>
</header>

<div class="container">
  <form id="uploadForm" action="/convert" method="post" enctype="multipart/form-data">
    <div class="drop-zone" id="dropZone">
      <p>Drag & drop your PNG, JPG, PDF, or TIFF file here<br>or click to select one</p>
      <input type="file" name="file" id="fileInput" accept=".png,.jpg,.jpeg,.pdf,.tif,.tiff" required>
      <div class="filename" id="filename"></div>
      <img id="previewImg" class="preview" />
    </div>

    <div class="options">
      <div class="option-row" id="pageNumberRow" style="display: none;">
        <strong>Page Number:</strong>
        <input type="number" name="page_number" id="pageNumber" value="0" min="0">
        <small>(for multi-page PDF/TIFF, default is 0)</small>
      </div>
      
      <div class="option-row">
        <input type="checkbox" name="include_pdf" id="includePdf" value="true">
        <label for="includePdf">
          <strong>Include PDF preview</strong> (download as ZIP with both DXF and PDF)
        </label>
      </div>
    </div>

    <button type="submit" class="submit-btn">Convert & Download</button>
    <div class="loader" id="loader">⏳ Converting, please wait...</div>
  </form>

  {% if error %}
  <div class="error">
    ⚠️ {{ error }}
  </div>
  {% endif %}
</div>

<script>
  const dropZone = document.getElementById("dropZone");
  const fileInput = document.getElementById("fileInput");
  const filenameDisplay = document.getElementById("filename");
  const previewImg = document.getElementById("previewImg");
  const loader = document.getElementById("loader");
  const form = document.getElementById("uploadForm");
  const pageNumberRow = document.getElementById("pageNumberRow");

  dropZone.addEventListener("click", () => fileInput.click());

  dropZone.addEventListener("dragover", e => {
    e.preventDefault();
    dropZone.classList.add("dragover");
  });

  dropZone.addEventListener("dragleave", () => {
    dropZone.classList.remove("dragover");
  });

  dropZone.addEventListener("drop", e => {
    e.preventDefault();
    dropZone.classList.remove("dragover");

    const files = e.dataTransfer.files;
    if (files.length > 0) {
      fileInput.files = files;
      showFileDetails(files[0]);
    }
  });

  fileInput.addEventListener("change", () => {
    if (fileInput.files.length > 0) {
      showFileDetails(fileInput.files[0]);
    }
  });

  function showFileDetails(file) {
    filenameDisplay.textContent = file.name;
    
    // Show page number option for PDF and TIFF files
    const ext = file.name.split('.').pop().toLowerCase();
    if (ext === 'pdf' || ext === 'tif' || ext === 'tiff') {
      pageNumberRow.style.display = 'block';
    } else {
      pageNumberRow.style.display = 'none';
    }

    if (file.type.startsWith("image/")) {
      const reader = new FileReader();
      reader.onload = e => {
        previewImg.src = e.target.result;
        previewImg.style.display = "block";
      };
      reader.readAsDataURL(file);
    } else {
      previewImg.style.display = "none";
    }
  }

  form.addEventListener("submit", () => {
    loader.style.display = "block";
  });
</script>

</body>
</html>
